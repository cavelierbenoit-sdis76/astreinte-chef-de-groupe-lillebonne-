<body>

<header>
<h1>🚒 ASTREINTE SDIS 76</h1>
<p>Planification Chef de Groupe Lillebonne 2027</p>
</header>

<div class="container">

<div class="card">

<h2>Nouvelle affectation</h2>

<label>Agent</label>

<select id="agent">
<option>Agent 1</option>
<option>Agent 2</option>
<option>Agent 3</option>
<option>Agent 4</option>
<option>Agent 5</option>
<option>Agent 6</option>
<option>Agent 7</option>
<option>Agent 8</option>
<option>Agent 9</option>
<option>Agent 10</option>
<option>Agent 11</option>
</select>

<br><br>

<label>Type d'astreinte</label>

<select id="type" onchange="majType()">
<option>Nuit</option>
<option>Week-end</option>
<option>Jour férié</option>
<option>Semaine complète</option>
<option>Personnalisée</option>
</select>

<br><br>

<label>Date début</label>

<input type="date" id="dateDebut">

<br><br>

<label>Date fin</label>

<input type="date" id="dateFin">

<div id="blocHoraire" style="display:none">

<br>

<label>Heure début</label>

<input type="time" id="heureDebut">

<br><br>

<label>Heure fin</label>

<input type="time" id="heureFin">

</div>

<br>

<label>Commentaire</label>

<br>

<textarea
id="commentaire"
rows="4"
style="width:100%">
</textarea>

<br><br>

<button onclick="enregistrer()">
Enregistrer
</button>

</div>

<div class="card">

<h2>Affectations enregistrées</h2>

<div id="liste">

Aucune affectation

</div>

</div>

</div>

<script>

function majType(){

let type =
document.getElementById("type").value;

let bloc =
document.getElementById("blocHoraire");

if(type==="Personnalisée"){

bloc.style.display="block";

}else{

bloc.style.display="none";

}

}

function enregistrer(){

let data={

agent:
document.getElementById("agent").value,

type:
document.getElementById("type").value,

dateDebut:
document.getElementById("dateDebut").value,

dateFin:
document.getElementById("dateFin").value,

heureDebut:
document.getElementById("heureDebut").value,

heureFin:
document.getElementById("heureFin").value,

commentaire:
document.getElementById("commentaire").value

};

localStorage.setItem(
"derniereAffectation",
JSON.stringify(data)
);

document.getElementById("liste")
.innerHTML=

"<b>Agent :</b> "+data.agent+"<br>"+
"<b>Type :</b> "+data.type+"<br>"+
"<b>Début :</b> "+data.dateDebut+"<br>"+
"<b>Fin :</b> "+data.dateFin+"<br>"+
"<b>Commentaire :</b> "+data.commentaire;

alert("Affectation enregistrée");

}

</script>

</body>
